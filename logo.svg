<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <!-- Badge background -->
  <circle cx="60" cy="60" r="58" fill="#1c1f24"/>

  <!-- Industrial gear ring -->
  <g fill="#5b6572">
    <rect x="54" y="2"  width="12" height="16"/>
    <rect x="54" y="102" width="12" height="16"/>
    <rect x="2"  y="54" width="16" height="12"/>
    <rect x="102" y="54" width="16" height="12"/>

    <rect x="54" y="2"  width="12" height="16" transform="rotate(45 60 60)"/>
    <rect x="54" y="2"  width="12" height="16" transform="rotate(135 60 60)"/>
    <rect x="54" y="2"  width="12" height="16" transform="rotate(225 60 60)"/>
    <rect x="54" y="2"  width="12" height="16" transform="rotate(315 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#5b6572" stroke-width="14"/>
  <circle cx="60" cy="60" r="39" fill="#1c1f24"/>

  <!-- Isometric crate (Vagrant box), OpenStack red -->
  <g stroke="#ED1944" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="60,38 82,50 60,62 38,50" fill="#ED1944" fill-opacity="0.95"/>
    <polygon points="38,50 60,62 60,86 38,74" fill="#9c0f2e" fill-opacity="0.95"/>
    <polygon points="60,62 82,50 82,74 60,86" fill="#c21339" fill-opacity="0.95"/>
  </g>

  <!-- Crate strapping lines -->
  <g stroke="#1c1f24" stroke-width="1.5" fill="none">
    <line x1="60" y1="38" x2="60" y2="62"/>
    <line x1="49" y1="56" x2="49" y2="80"/>
    <line x1="71" y1="56" x2="71" y2="80"/>
  </g>
</svg>
